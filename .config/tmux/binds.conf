unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf

# Splits
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-k copy-mode \; send-keys -X halfpage-up
bind -n M-j if-shell -F '#{pane_in_mode}' 'send-keys -X halfpage-down'
bind -T copy-mode-vi M-k send-keys -X halfpage-up
bind -T copy-mode-vi Escape send-keys -X cancel
#This checks if the position is zero (i.e. at the bottom) & exits copy-mode if true.
bind -T copy-mode-vi M-j if-shell -F '#{==:#{copy_cursor_y},#{e|-:#{pane_height},1}}' \
    'send-keys -X cancel' \
    'send-keys -X halfpage-down'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
